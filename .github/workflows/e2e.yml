name: E2E

# Flujo completo en cada PR a master: levanta Supabase local, aplica las
# migraciones (valida SQL nuevo) y corre las suites e2e.
#
# No necesita secretos: todo corre contra el stack local del runner.
# Ver .agents/skills/pull-request-workflow/SKILL.md

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Supabase local + suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # -x evita contenedores que no usan los tests (studio, analytics, etc.).
      - name: Levantar Supabase local
        run: supabase start -x studio,postgres-meta,imgproxy,vector,logflare,supavisor,mailpit

      - name: Configurar .env.local
        run: |
          supabase status -o env > /tmp/supabase.env
          ANON=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          SERVICE=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          {
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54331"
            echo "VITE_SUPABASE_ANON_KEY=$ANON"
          } > .env.local
          echo "SUPABASE_SERVICE_ROLE=$SERVICE" >> "$GITHUB_ENV"

      - name: Browsers de Playwright
        run: pnpm exec playwright install --with-deps firefox chromium

      - name: Dev server
        run: |
          nohup pnpm dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vite.log
          exit 1

      - name: E2E flujo principal (47 pasos)
        run: |
          SUPABASE_URL=http://127.0.0.1:54331 bash tests/reset-sandbox.sh
          node tests/e2e-flow.mjs

      - name: E2E móvil
        run: |
          SUPABASE_URL=http://127.0.0.1:54331 bash tests/reset-sandbox.sh
          node tests/e2e-mobile.mjs

      - name: Check mobile (overflow 375/320px)
        run: node tests/check-mobile.mjs

      - name: E2E realtime
        run: |
          SUPABASE_URL=http://127.0.0.1:54331 bash tests/reset-sandbox.sh
          node tests/e2e-realtime.mjs
