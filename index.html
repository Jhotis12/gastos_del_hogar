<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Gestiona el presupuesto común de tu hogar: gastos, servicios, ahorros y metas." />
    <meta name="theme-color" content="#206c55" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1210" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gastos del Hogar" />
    <title>Gastos del Hogar</title>
    <!-- Tema aplicado antes del primer paint: evita el pantallazo blanco al
         recargar en modo oscuro (el bundle JS corre al final del body). -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <style>
      /* Fondo de arranque antes de que cargue el CSS (dev): con el mismo
         valor que --cream en cada tema para que no haya parpadeo claro. */
      html {
        background-color: #f6f5f0;
      }
      html.dark {
        background-color: #0c1210;
      }
      html.dark .force-light {
        background-color: #f6f5f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
